# ============================================================
#  Nginx configuration for the Municipal Portal
#  Copy to: /etc/nginx/sites-available/portal
#  Then:    sudo ln -s /etc/nginx/sites-available/portal /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
#  IMPORTANT: replace the server_name list with your real domains.
#  The "Host" header MUST be passed through - that is how the app
#  knows which municipality to show.
# ============================================================

# The website (all 21 municipality domains point here)
server {
    listen 80;
    listen [::]:80;

    server_name
        _
        # --- replace the line above with your domains, for example: ---
        # mulugumunicipality.in www.mulugumunicipality.in
        # asifabadmunicipality.in www.asifabadmunicipality.in
        ;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;   # <- do not remove
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}

# The backend (database API, logins, uploaded files)
server {
    listen 80;
    listen [::]:80;

    server_name api.example.gov.in;   # <- replace with your API subdomain

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
