# Routes every backend request to the right container.
_format_version: "2.1"
services:
  - name: auth
    url: http://auth:9999/
    routes:
      - name: auth-route
        paths: ["/auth/v1"]
        strip_path: true
  - name: rest
    url: http://rest:3000/
    routes:
      - name: rest-route
        paths: ["/rest/v1"]
        strip_path: true
  - name: storage
    url: http://storage:5000/
    routes:
      - name: storage-route
        paths: ["/storage/v1"]
        strip_path: true
plugins:
  - name: cors
